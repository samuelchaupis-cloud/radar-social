[project]
name = "radar-social"
version = "0.1.0"
description = "Plataforma OSINT cívica para monitorización de contratos públicos"
authors = [
    {name = "Principal DevOps", email = "devops@radar-social.local"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "selectolax>=0.3.21",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13.1",
    "structlog>=24.1.0",
    "tenacity>=8.2.3",
    "aiosqlite>=0.22.1",
    "curl-cffi>=0.16.2",
]



[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = [
    "pydantic.mypy"
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=src"
testpaths = [
    "tests",
]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "bandit>=1.7.7",
    "mypy>=1.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "pytest-httpx>=0.36.2",
    "ruff>=0.3.0",
]
[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
